[project]
name = "mapartica"
version = "0.1.0"
description = "Convert an image into a Minecraft map art (.litematic)."
readme = "README.md"
authors = [{ name = "Xeniume", email = "ohmyxeniume@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["litemapy>=0.11.0b0", "numpy>=2.5.4", "pillow>=13.0.0"]

[project.scripts]
mapartica = "mapartica:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
